name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            suffix: macos-arm64
          - os: macos-14
            suffix: macos-x86_64
            scie-platform: macos-x86_64
          - os: ubuntu-latest
            suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            suffix: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pex
        run: pip install pex

      - name: Build scie binary
        run: bash build.sh
        env:
          OUTPUT_SUFFIX: ${{ matrix.suffix }}
          SCIE_PLATFORM: ${{ matrix.scie-platform }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flightclaw-${{ matrix.suffix }}
          path: dist/flightclaw-${{ matrix.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum flightclaw-* > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/flightclaw-*
            artifacts/checksums.txt
